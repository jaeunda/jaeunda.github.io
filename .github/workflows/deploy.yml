name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      # The 4DPLEX portfolio is a separate Vite app served from a sub-path.
      # Quartz empties `public` when it builds, so this has to run after it.
      - name: Build portfolio-4dplex
        working-directory: portfolio-4dplex
        run: |
          npm ci
          npm run build
      - name: Add portfolio-4dplex to the site
        run: |
          mkdir -p public/portfolio-4dplex
          cp -R portfolio-4dplex/dist/. public/portfolio-4dplex/
      # The DB Inc. portfolio is a second standalone Vite app, built the same way.
      - name: Build portfolio-dbinc
        working-directory: portfolio-dbinc
        run: |
          npm ci
          npm run build
      - name: Add portfolio-dbinc to the site
        run: |
          mkdir -p public/portfolio-dbinc
          cp -R portfolio-dbinc/dist/. public/portfolio-dbinc/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
